[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "employee-knowledge"
version = "0.1.0"
description = "Provenance-first employee knowledge graph and discrepancy detection"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["rdflib>=7.0,<8", "openpyxl>=3.1,<4", "pyshacl>=0.25,<1", "typer>=0.12,<1", "rich>=13,<15"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.5,<1"]

[project.scripts]
employee-knowledge = "ek.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ek = ["ontology/*.ttl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
